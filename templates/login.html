{% extends "base.html" %}

{% block title %}Admin Sign In | TechCore Tracker{% endblock %}

{% block content %}
<div style="max-width: 440px; margin: 2rem auto; padding: 0 1rem;">
    <div class="glass-panel" style="padding: 2rem; border-top: 4px solid var(--accent-cyan);">
        <div style="text-align: center; margin-bottom: 1.75rem;">
            <div style="width: 54px; height: 54px; background: linear-gradient(135deg, var(--accent-cyan), var(--accent-blue)); border-radius: 16px; display: inline-flex; align-items: center; justify-content: center; color: #fff; font-size: 1.6rem; margin-bottom: 0.75rem; box-shadow: 0 0 20px rgba(6, 182, 212, 0.4);">
                <i class="fa-solid fa-user-shield"></i>
            </div>
            <h1 style="font-size: 1.4rem; font-weight: 800; color: var(--text-heading); margin-bottom: 0.3rem;">Administrator Login</h1>
            <p style="font-size: 0.85rem; color: var(--text-muted);">Sign in to access admin privileges, leave approvals & system settings</p>
        </div>

        <form method="POST" action="{{ url_for('login') }}">
            <div class="form-group">
                <label class="form-label">Admin Username</label>
                <div style="position: relative;">
                    <i class="fa-solid fa-user" style="position: absolute; left: 12px; top: 50%; transform: translateY(-50%); color: var(--text-muted);"></i>
                    <input type="text" name="username" class="form-input" style="padding-left: 38px;" placeholder="admin" required autofocus>
                </div>
            </div>

            <div class="form-group" style="margin-bottom: 1.5rem;">
                <label class="form-label">Password</label>
                <div style="position: relative;">
                    <i class="fa-solid fa-lock" style="position: absolute; left: 12px; top: 50%; transform: translateY(-50%); color: var(--text-muted);"></i>
                    <input type="password" id="loginPassword" name="password" class="form-input" style="padding-left: 38px; padding-right: 38px;" placeholder="••••••••" required>
                    <i class="fa-solid fa-eye" id="togglePassIcon" onclick="togglePasswordVisibility()" style="position: absolute; right: 12px; top: 50%; transform: translateY(-50%); color: var(--text-muted); cursor: pointer;"></i>
                </div>
            </div>

            <button type="submit" class="btn-tech" style="width: 100%; min-height: 48px; font-size: 1rem;">
                <i class="fa-solid fa-right-to-bracket"></i> Authenticate Session
            </button>
        </form>

        <div style="margin-top: 1.5rem; padding: 0.85rem; background: rgba(6, 182, 212, 0.08); border: 1px dashed rgba(6, 182, 212, 0.3); border-radius: var(--radius-sm); font-size: 0.8rem; color: var(--text-muted); text-align: center;">
            <i class="fa-solid fa-key text-info me-1"></i> Default Admin Credentials: <br>
            <strong style="color: var(--text-heading);">Username:</strong> <code>admin</code> &bull; <strong style="color: var(--text-heading);">Password:</strong> <code>admin123</code>
        </div>
    </div>
</div>

<script>
function togglePasswordVisibility() {
    const passInput = document.getElementById('loginPassword');
    const icon = document.getElementById('togglePassIcon');
    if (passInput.type === 'password') {
        passInput.type = 'text';
        icon.className = 'fa-solid fa-eye-slash';
    } else {
        passInput.type = 'password';
        icon.className = 'fa-solid fa-eye';
    }
}
</script>
{% endblock %}
